<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIMAC G1 | Administration</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#f5f7ff;color:#172033}header{background:linear-gradient(135deg,#4338ca,#6366f1,#7c3aed);color:#fff;padding:32px 20px}header>div,main{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top a{color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:10px 14px;border-radius:12px}.card{background:#fff;margin:24px auto;padding:24px;border-radius:20px;box-shadow:0 12px 35px rgba(30,41,59,.08)}.auth{display:grid;grid-template-columns:1fr auto;gap:12px}.auth input,.cell input,.cell select{width:100%;padding:11px;border:1px solid #dbe1ee;border-radius:10px;font:inherit}.grid{overflow:auto}.editor{min-width:950px;border-collapse:collapse;width:100%}.editor th,.editor td{border-bottom:1px solid #e9edf5;padding:9px;vertical-align:top}.editor th{background:#f8f9fd;text-align:left}.time{font-weight:800;white-space:nowrap}.cell{min-width:150px}.actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}#save{background:#4338ca;color:#fff}#add{background:#eef2ff;color:#3730a3}.danger{background:#fee2e2;color:#991b1b;padding:8px 10px}#status{font-weight:700}.hint{color:#64748b;font-size:14px;line-height:1.5}.locked{display:none}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:15px}.toolbar h2{margin:0}@media(max-width:700px){.auth{grid-template-columns:1fr}.card{margin:14px;padding:16px}header{padding:24px 14px}}
</style></head>
<body>
<header><div class="top"><div><h1>⚙️ Modifier l'emploi du temps</h1><p>SIMAC Groupe 1 · GitHub Pages + Google Apps Script</p></div><a href="index.html">← Voir le planning</a></div></header>
<main>
<div class="card"><div class="toolbar"><h2>🔐 Accès administrateur</h2></div><div class="auth"><input id="key" type="password" placeholder="Mot de passe administrateur"><button id="load">Charger le planning</button></div><p class="hint">Le mot de passe est vérifié côté Google Apps Script. Ne mets jamais la clé dans <code>config.js</code>.</p></div>
<div class="card locked" id="panel"><div class="toolbar"><h2>📅 Éditeur</h2><button id="add">+ Ajouter un horaire</button></div><div class="grid"><table class="editor"><thead><tr><th>Horaire</th><th>Lundi</th><th>Mardi</th><th>Mercredi</th><th>Jeudi</th><th>Vendredi</th><th>Samedi</th><th>Dimanche</th><th></th></tr></thead><tbody id="editorBody"></tbody></table></div><div class="actions"><button id="save">💾 Enregistrer</button><span id="status"></span></div></div>
</main>
<script src="config.js"></script>
<script>
const days=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];let data={version:1,days,rows:[]};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function loadJsonp(url){return new Promise((resolve,reject)=>{const cb='admin_cb_'+Date.now();const s=document.createElement('script');const sep=url.includes('?')?'&':'?';const timer=setTimeout(()=>{cleanup();reject()},8000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject()};s.src=url+sep+'callback='+cb+'&t='+Date.now();document.head.appendChild(s)})}
function render(){const body=document.getElementById('editorBody');body.innerHTML=data.rows.map((r,i)=>`<tr><td class="cell"><input data-r="${i}" data-f="time" value="${esc(r.time)}"></td>${r.days.map((c,j)=>`<td class="cell"><input data-r="${i}" data-d="${j}" data-f="title" value="${esc(c.title)}"><select data-r="${i}" data-d="${j}" data-f="type"><option value="subject" ${c.type==='subject'?'selected':''}>Cours</option><option value="group" ${c.type==='group'?'selected':''}>Groupe/Meet</option><option value="free" ${c.type==='free'?'selected':''}>Libre</option></select></td>`).join('')}<td><button class="danger" onclick="removeRow(${i})">Supprimer</button></td></tr>`).join('')}
function sync(){document.querySelectorAll('[data-f]').forEach(el=>{const i=+el.dataset.r;if(el.dataset.f==='time')data.rows[i].time=el.value;else if(el.dataset.f==='title')data.rows[i].days[+el.dataset.d].title=el.value;else data.rows[i].days[+el.dataset.d].type=el.value;});}
function removeRow(i){data.rows.splice(i,1);render()}
document.getElementById('load').onclick=async()=>{const key=document.getElementById('key').value.trim();if(!key)return alert('Entre le mot de passe.');try{data=await loadJsonp(API_URL+'?action=get&key='+encodeURIComponent(key));document.getElementById('panel').style.display='block';document.getElementById('panel').dataset.key=key;render();document.getElementById('status').textContent='Planning chargé.'}catch(e){alert('Impossible de charger. Vérifie l’URL Apps Script et le mot de passe.')}};
document.getElementById('add').onclick=()=>{sync();data.rows.push({time:'17h - 19h',days:days.map(()=>({type:'free',title:'Libre'}))});render()};
document.getElementById('save').onclick=()=>{sync();const key=document.getElementById('panel').dataset.key;if(!key)return;const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target='saveFrame';[['action','save'],['key',key],['data',JSON.stringify(data)]].forEach(([n,v])=>{const i=document.createElement('input');i.type='hidden';i.name=n;i.value=v;form.appendChild(i)});document.body.appendChild(form);form.submit();form.remove();document.getElementById('status').textContent='⏳ Enregistrement envoyé…';setTimeout(()=>document.getElementById('status').textContent='✅ Enregistré. Recharge la page publique.',1200)};
</script><iframe name="saveFrame" style="display:none"></iframe>
</body></html>
